
name: Build Inventar EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file EXE
        run: dotnet publish Inventar.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - uses: actions/upload-artifact@v4
        with:
          name: Inventar-Windows-EXE
          path: bin/Release/net10.0-windows/win-x64/publish/Inventar.exe
          if-no-files-found: error
          retention-days: 7
